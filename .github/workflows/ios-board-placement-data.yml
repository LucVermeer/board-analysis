name: iOS Board Placement Data

on:
  push:
    branches-ignore: [main]
    paths:
      - 'packages/board-constants/**'
      - 'mobile/ios/App/App/BoardPlacementData.swift'
      - 'vite.config.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ios-board-placement-data.yml'
  pull_request:
    paths:
      - 'packages/board-constants/**'
      - 'mobile/ios/App/App/BoardPlacementData.swift'
      - 'vite.config.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ios-board-placement-data.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 'lts'
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check generated Swift board placement data
        run: vp run check:ios-board-placement-data
