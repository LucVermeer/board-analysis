name: Deploy app.boardsesh.com (Expo web)

# Production deploy pipeline for the STANDALONE Expo web export served at the root
# of app.boardsesh.com (Cloudflare Pages project `boardsesh-app`). This is the
# `--subdomain` export (baseUrl `/`), distinct from the `/app` export the web
# Docker image bakes. See docs/expo-web-deployment.md.
#
# Manual ops this pipeline depends on (provisioned outside the repo):
#   - Cloudflare Pages project `boardsesh-app` (direct upload) + custom domain
#     app.boardsesh.com.
#   - CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID secrets in the `Production`
#     GitHub environment.

on:
  push:
    branches: [main]
    paths:
      - 'packages/mobile/**'
      - 'packages/shared/**'
      - 'packages/shared-schema/**'
      - 'scripts/build-expo-web-export.sh'
      - 'deploy/app-subdomain/**'
      - 'bun.lock'
      - '.github/workflows/app-web-deploy.yml'
  workflow_dispatch:
    inputs:
      skip_smoke:
        description: 'Emergency bypass of the Playwright smoke gate'
        type: boolean
        default: false

concurrency:
  # One deploy at a time; a newer push to main supersedes an in-flight run.
  group: app-web-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Smoke gate — boots the full expo-web dev stack (backend + Next proxy + Metro
  # web) via `vp run test:e2e:expo-web` and runs the `expo-web-smoke` Playwright
  # project against it. This is an adapted copy of the `expo-web-smoke` job in
  # e2e-tests.yml.
  #
  # Why the DEV-STACK suite and not the built artifact: the smoke suite exercises
  # the exact Metro browser bundle + auth/WS wiring the export is built from, so
  # a green run is real confidence the shell renders and authenticates. The
  # static artifact itself is verified separately (bake-verify grep + post-deploy
  # curl smoke in the `deploy` job).
  #
  # The e2e-tests.yml original has `needs: [typecheck]`; that job lives in that
  # workflow and isn't reachable here. We deliberately DROP it rather than
  # inline a typecheck: this pipeline only runs on push to `main`, which is
  # already CI-green post-merge (typecheck ran on the PR), so a re-typecheck adds
  # ~2 min for no signal. The smoke suite is the gate.
  smoke:
    name: Expo-web smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Skipped only via the emergency workflow_dispatch bypass.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_smoke) }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 'lts'
          cache: true

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          # Bare-runner key — matches the typecheck/expo-web-smoke jobs in
          # e2e-tests.yml, deliberately NOT the playwright-noble container key.
          key: ${{ runner.os }}-bun-node-modules-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-node-modules-

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Install Playwright chromium
        run: bunx playwright install --with-deps chromium
        working-directory: packages/web

      - name: Run expo-web smoke suite
        # The vp task graph provides db:up (dev-db compose stack, seeded test
        # user) and the mobile web-runtime install; scripts/expo-web-e2e.ts boots
        # the orchestrator, waits for /app to serve the Expo shell, runs
        # Playwright, and tears the stack down. Exit code mirrors Playwright's.
        run: vp run test:e2e:expo-web

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-expo-web-smoke
          path: packages/web/playwright-report/
          retention-days: 7

      - name: Upload Playwright test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-expo-web-smoke
          path: packages/web/test-results/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Deploy — export the standalone SPA with the PRODUCTION env trio baked in,
  # verify the origins actually landed in the bundles, add the Pages host config,
  # publish to Cloudflare Pages, then curl-smoke the live origin.
  # ---------------------------------------------------------------------------
  deploy:
    name: Export and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    environment: Production
    needs: [smoke]
    # Proceed when the gate passed OR was skipped (emergency bypass). Any other
    # smoke result (failure/cancelled) blocks the deploy.
    if: ${{ always() && (needs.smoke.result == 'success' || needs.smoke.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build standalone Expo web export (production env baked in)
        # EXPO_PUBLIC_WEB_URL is the AUTH origin and is deliberately
        # www.boardsesh.com, NOT app.boardsesh.com: the SPA does credentialed
        # cross-origin auth against www. See docs/expo-web-deployment.md.
        #
        # BOARDSESH_EXPORT_EXPECT_URLS is inert until the sibling PR
        # (fix/expo-web-export-metro-cache) lands the `--clear` + env-assertion
        # support; once it does, it becomes the in-export stale-env detector. The
        # independent grep step below covers us regardless.
        run: |
          EXPO_PUBLIC_BACKEND_URL=https://ws.boardsesh.com \
          EXPO_PUBLIC_WS_URL=wss://ws.boardsesh.com/graphql \
          EXPO_PUBLIC_WEB_URL=https://www.boardsesh.com \
          BOARDSESH_EXPORT_EXPECT_URLS="https://ws.boardsesh.com https://www.boardsesh.com" \
          bash scripts/build-expo-web-export.sh --subdomain "$RUNNER_TEMP/app-standalone"

      - name: Verify production origins are baked into the bundles
        # Belt-and-braces stale-env guard, independent of the sibling PR's
        # BOARDSESH_EXPORT_EXPECT_URLS. `expo export` reuses Metro's transform
        # cache even when EXPO_PUBLIC_* change, so an old env can silently ship;
        # grep the emitted JS bundles for both prod origins and fail otherwise.
        run: |
          set -euo pipefail
          export_dir="$RUNNER_TEMP/app-standalone"
          js_glob="$export_dir/_expo/static/js/web"
          for origin in ws.boardsesh.com www.boardsesh.com; do
            if ! grep -rql "$origin" "$js_glob"/*.js; then
              echo "::error::Expected origin '$origin' not found in $js_glob/*.js — stale env baked into the export?" >&2
              exit 1
            fi
            echo "ok: found '$origin' in the emitted bundles"
          done

      - name: Add Cloudflare Pages host config to the export
        # _redirects (SPA fallback) + _headers (noindex/caching/no-CSP) are host
        # config, not part of the export. Copy them into the publish dir.
        run: |
          set -euo pipefail
          cp deploy/app-subdomain/_redirects "$RUNNER_TEMP/app-standalone/_redirects"
          cp deploy/app-subdomain/_headers   "$RUNNER_TEMP/app-standalone/_headers"

      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bunx wrangler@4 pages deploy "$RUNNER_TEMP/app-standalone" \
            --project-name=boardsesh-app \
            --branch=main

      - name: Post-deploy smoke against app.boardsesh.com
        # Cloudflare's edge can lag a few seconds behind a fresh deploy, so each
        # check retries a short propagation loop. Verifies: root serves the HTML
        # shell, a deep route SPA-falls back to the shell, a content-hashed asset
        # is immutable-cached, index.html is NOT immutable, noindex is present,
        # and the WASM binary serves with a wasm/octet content type.
        run: |
          set -uo pipefail
          base=https://app.boardsesh.com

          # Retry a curl assertion for up to ~60s of edge propagation.
          retry() {
            local desc="$1"; shift
            for attempt in $(seq 1 12); do
              if "$@"; then
                echo "ok: $desc"
                return 0
              fi
              echo "  ($desc) attempt $attempt failed; retrying in 5s..."
              sleep 5
            done
            echo "::error::post-deploy smoke failed: $desc" >&2
            return 1
          }

          check_root() {
            local out; out=$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' "$base/")
            echo "$out" | grep -q '^200 ' && echo "$out" | grep -qi 'text/html'
          }

          check_deep_route() {
            # SPA fallback: a route with no real file must still 200 the shell.
            local code; code=$(curl -sS -o /dev/null -w '%{http_code}' "$base/climbs")
            [ "$code" = "200" ]
          }

          check_noindex() {
            curl -sSI "$base/" | grep -qi '^x-robots-tag:.*noindex'
          }

          check_wasm() {
            local out; out=$(curl -sS -o /dev/null -w '%{http_code} %{content_type}' \
              "$base/wasm/board_renderer_wasm_bg.wasm")
            echo "$out" | grep -q '^200 ' \
              && echo "$out" | grep -qiE 'application/(wasm|octet-stream)'
          }

          check_index_not_immutable() {
            # index.html must revalidate — no immutable cache directive.
            local cc; cc=$(curl -sSI "$base/index.html" | tr -d '\r' \
              | grep -i '^cache-control:' || true)
            ! echo "$cc" | grep -qi 'immutable'
          }

          # A real content-hashed asset URL, parsed out of the served index.html,
          # must come back immutable-cached.
          check_hashed_asset_immutable() {
            local asset_path
            asset_path=$(curl -sS "$base/" \
              | grep -oE '/_expo/static/[^"'"'"']+\.js' | head -n1)
            [ -n "$asset_path" ] || { echo "  no /_expo asset found in index.html"; return 1; }
            local cc; cc=$(curl -sSI "$base$asset_path" | tr -d '\r' \
              | grep -i '^cache-control:' || true)
            echo "$cc" | grep -qi 'immutable'
          }

          retry "root / → 200 text/html"                 check_root
          retry "deep route /climbs → 200 (SPA shell)"    check_deep_route
          retry "X-Robots-Tag: noindex on /"              check_noindex
          retry "wasm binary → 200 wasm/octet-stream"     check_wasm
          retry "index.html is NOT immutable-cached"      check_index_not_immutable
          retry "hashed _expo asset is immutable-cached"  check_hashed_asset_immutable
