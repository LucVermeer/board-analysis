name: Mobile Store Metadata

# Pushes the source-controlled store listing text to App Store Connect / Google
# Play for the React Native app (packages/mobile). iOS uses deliver
# (fastlane/metadata/en-US/), Android uses supply
# (fastlane/metadata/android/en-US/). Listing text only — no binary, no
# screenshots, no review submission, no staged rollout. The text lands on the
# editable App Store version / Play draft listing, so a wrong value is fixed by
# editing the .txt and re-running. Manual dispatch only (the listing copy
# changes far less often than screenshots or builds).
#
# The Android "What's new" / release notes are NOT pushed here — they ship with
# the AAB at release time via android-apk-rn.yml (whatsNewDirectory), sourced
# from the same changelogs/default.txt.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Which store(s) to push listing text to'
        required: true
        type: choice
        default: all
        options:
          - all
          - ios
          - android

concurrency:
  group: mobile-store-metadata-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Scopes the job to the Production GitHub Environment so it can read the
    # App Store Connect / Google Play credentials (same secrets as the
    # screenshot upload job in mobile-screenshots.yml).
    environment: Production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
          working-directory: fastlane

      - name: Decode App Store Connect API key
        if: ${{ inputs.platform == 'ios' || inputs.platform == 'all' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "$APP_STORE_CONNECT_API_KEY_ID" ] || { echo "::error::Missing APP_STORE_CONNECT_API_KEY_ID."; exit 1; }
          [ -n "$APP_STORE_CONNECT_API_KEY_BASE64" ] || { echo "::error::Missing APP_STORE_CONNECT_API_KEY_BASE64."; exit 1; }
          mkdir -p "$HOME/.private_keys"
          key_path="$HOME/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$key_path"
          grep -q 'BEGIN PRIVATE KEY' "$key_path" || { echo "::error::APP_STORE_CONNECT_API_KEY_BASE64 did not decode to an App Store Connect private key."; exit 1; }
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Upload App Store listing text
        if: ${{ inputs.platform == 'ios' || inputs.platform == 'all' }}
        working-directory: fastlane
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_DISABLE_ANIMATION: '1'
        run: |
          set -euo pipefail
          [ -n "$APP_STORE_CONNECT_ISSUER_ID" ] || { echo "::error::Missing APP_STORE_CONNECT_ISSUER_ID."; exit 1; }
          bundle exec fastlane ios metadata

      - name: Clean up App Store Connect key
        if: always()
        run: rm -f "$HOME/.private_keys/AuthKey_"*.p8 2>/dev/null || true

      - name: Upload Play Store listing text
        if: ${{ inputs.platform == 'android' || inputs.platform == 'all' }}
        working-directory: fastlane
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_DISABLE_ANIMATION: '1'
        run: |
          set -euo pipefail
          [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ] || { echo "::error::Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON."; exit 1; }
          bundle exec fastlane android metadata

      - name: Upload Play Store listing images
        if: ${{ inputs.platform == 'android' || inputs.platform == 'all' }}
        working-directory: fastlane
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_DISABLE_ANIMATION: '1'
        run: |
          set -euo pipefail
          [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ] || { echo "::error::Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON."; exit 1; }
          bundle exec fastlane android images
