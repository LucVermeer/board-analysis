name: Mobile CI

on:
  pull_request:
    paths:
      - 'packages/mobile/**'
      - 'packages/board-constants/**'
      - 'packages/shared-schema/**'
      - 'packages/shared/ble-protocol/**'
      - 'packages/shared/board-config/**'
      - 'packages/shared/queue/**'
      - '.github/workflows/mobile-ci.yml'

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 'lts'
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: vp run typecheck:mobile

      - name: Unit tests
        run: vp test run --project mobile --reporter=agent

      - name: Metro bundle check
        run: vp run check:mobile-bundle
