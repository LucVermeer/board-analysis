name: Android APK Build (React Native)

# Builds a signed, sideloadable release APK for the React Native rewrite
# (packages/mobile/) and attaches it to a GitHub Release. Unlike the Capacitor
# app (.github/workflows/android-release.yml), packages/mobile/ is a managed
# Expo project with no committed android/ — it's generated by `expo prebuild`.
# Android builds fine on a free Linux runner, so no macOS needed (cf. the iOS
# RN workflow ios-testflight-rn.yml, which mirrors this prebuild flow).

on:
  push:
    branches: [main]
    paths:
      - 'packages/mobile/**'
      - 'packages/shared/**'
      - 'packages/board-constants/**'
      - 'packages/shared-schema/**'
      - '.github/workflows/android-apk-rn.yml'
  workflow_dispatch:
    inputs:
      version_code_offset:
        description: 'Added to GH run_number for versionCode (raise to clear collisions / always supersede the Capacitor app)'
        required: false
        default: '2000000'

concurrency:
  group: android-apk-rn-${{ github.ref }}
  # Don't cancel an in-flight run: it may be between `assembleRelease` and the
  # GitHub Release publish, where a cancel could leave a tag with no asset.
  cancel-in-progress: false

permissions:
  contents: write # required for softprops/action-gh-release

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Scopes the job to the Production GitHub Environment so it can read the
    # Production-scoped SENTRY_AUTH_TOKEN secret. Mirrors ios-testflight-rn.yml.
    environment: Production

    env:
      EXPO_PUBLIC_BACKEND_URL: https://ws.boardsesh.com
      EXPO_PUBLIC_WS_URL: wss://ws.boardsesh.com/graphql
      EXPO_PUBLIC_WEB_URL: https://www.boardsesh.com
      # Activates Sentry at runtime in the shipped build (src/lib/sentry.ts gates
      # on this var). Same DSN/project as web + backend; not secret — already
      # hardcoded in packages/web and packages/backend source.
      EXPO_PUBLIC_SENTRY_DSN: https://f55e6626faf787ae5291ad75b010ea14@o4510644927660032.ingest.us.sentry.io/4510644930150400

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install Node.js dependencies (workspace root)
        run: bun install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-rn-${{ hashFiles('packages/mobile/package.json', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-rn-

      - name: Write .env for Expo build-time inlining
        working-directory: packages/mobile
        run: |
          cat > .env <<EOF
          EXPO_PUBLIC_BACKEND_URL=$EXPO_PUBLIC_BACKEND_URL
          EXPO_PUBLIC_WS_URL=$EXPO_PUBLIC_WS_URL
          EXPO_PUBLIC_WEB_URL=$EXPO_PUBLIC_WEB_URL
          EXPO_PUBLIC_SENTRY_DSN=$EXPO_PUBLIC_SENTRY_DSN
          EOF

      # The @sentry/react-native Gradle plugin uploads JS source maps during
      # `assembleRelease`. Without a token the upload errors and fails the build,
      # so gate it: only enable the upload when SENTRY_AUTH_TOKEN is present,
      # otherwise skip it and keep the build green. SENTRY_DISABLE_AUTO_UPLOAD is
      # read by the Sentry RN integration. Mirrors ios-testflight-rn.yml.
      - name: Configure Sentry source map upload
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_DISABLE_AUTO_UPLOAD=false" >> "$GITHUB_ENV"
            echo "Sentry auth token present — source maps will upload."
          else
            echo "SENTRY_DISABLE_AUTO_UPLOAD=true" >> "$GITHUB_ENV"
            echo "::warning::SENTRY_AUTH_TOKEN not set — skipping Sentry source map upload."
          fi

      - name: Expo prebuild (generate android/)
        working-directory: packages/mobile
        env:
          # Android Google Maps key, baked in at prebuild time when present. Build
          # succeeds without it; the board-search map just stays blank.
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: bunx expo prebuild --platform android --clean --no-install

      - name: Set version code
        # versionCode = offset + run_number. The offset keeps this line strictly
        # above the Capacitor app's versionCode so an install upgrades in place.
        # NOTE: github.run_number resets to 1 if this workflow file is renamed or
        # recreated — if you ever do that, bump version_code_offset past the
        # current production ceiling via the workflow_dispatch input, or new
        # builds will be un-installable over existing ones.
        run: |
          offset=${{ github.event.inputs.version_code_offset || '2000000' }}
          code=$(( offset + ${{ github.run_number }} ))
          sed -Ei "s/^([[:space:]]*)versionCode .*/\\1versionCode ${code}/" packages/mobile/android/app/build.gradle
          echo "versionCode set to ${code} (versionName comes from app.config.ts: 2.0.0)"

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > packages/mobile/android/app/release.keystore

      - name: Build signed release APK
        working-directory: packages/mobile/android
        env:
          # Read by the release signingConfig injected via the
          # with-android-release-signing config plugin (same env-var names as the
          # Capacitor app's build.gradle, so the secrets line up 1:1).
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/packages/mobile/android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Consumed by the @sentry/react-native Gradle plugin. The
          # SENTRY_DISABLE_AUTO_UPLOAD gate above (via $GITHUB_ENV) decides
          # whether the upload actually runs.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: ./gradlew assembleRelease --stacktrace

      # Guard against shipping an unsigned / debug-signed APK as if it were the
      # release build: assert the artifact verifies and log its signer cert so
      # the signing key is auditable in the run log.
      - name: Verify APK signature
        run: |
          apk=$(find packages/mobile/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$apk" ]; then echo "::error::No release APK was produced."; exit 1; fi
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -n 1)"
          echo "Verifying $apk with $apksigner"
          "$apksigner" verify --print-certs "$apk"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boardsesh-rn-android-${{ github.run_number }}
          path: packages/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rn-android-2.0.${{ github.run_number }}
          name: Boardsesh RN Android 2.0 (build ${{ github.run_number }})
          body: |
            React Native rewrite — Android sideload build from commit ${{ github.sha }}.

            **Package:** `com.boardsesh.app` (version 2.0.0)
            **Minimum Android version:** 7.0 (API 24)

            Sideload `app-release.apk`. It's signed with the same key as the
            current app, so it upgrades an existing `com.boardsesh.app` install
            in place — no need to uninstall first.
          files: |
            packages/mobile/android/app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up keystore
        if: always()
        run: rm -f packages/mobile/android/app/release.keystore
