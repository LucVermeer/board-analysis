appId: com.boardsesh.app
name: login (subflow)
---
# Reusable login subflow. The caller loads the Metro bundle into the dev-client
# and waits for the signed-out auth screen before invoking this. Fill the seeded
# test credentials (passed by the orchestrator via `maestro test -e
# SCREENSHOT_USER_EMAIL=... -e SCREENSHOT_USER_PASSWORD=...`) and wait until the
# app redirects out of auth.
#
# A "Sign in to your Apple Account" system alert can linger on the simulator from
# a prior Apple-auth attempt and cover the login form (the orchestrator's app
# reinstall resets app data but not system modals). Dismiss it if present.
- tapOn:
    text: 'Close'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'auth-email-input'
    timeout: 30000
- tapOn:
    id: 'auth-email-input'
- inputText: ${SCREENSHOT_USER_EMAIL}
- tapOn:
    id: 'auth-password-input'
- inputText: ${SCREENSHOT_USER_PASSWORD}
# Submit via the keyboard return key — the password field's onSubmitEditing
# triggers sign-in. Locale-independent, and avoids depending on the submit
# button's testID (the glass button wraps a reanimated AnimatedPressable, which
# doesn't reliably surface testID to the iOS accessibility tree).
- pressKey: Enter
# The email field disappearing is the reliable "auth succeeded + redirected"
# signal — more robust than racing a specific tab's content load.
- extendedWaitUntil:
    notVisible:
      id: 'auth-email-input'
    timeout: 45000
# iOS offers to save the just-entered password; dismiss it so the system dialog
# doesn't cover the captured screens (and block the board picker).
- tapOn:
    text: 'Not Now'
    optional: true
